name: Build lock incident recovery audit

on:
  schedule:
    - cron: "2,12,22,32,42,52 * * * *"
  workflow_dispatch:

permissions:
  contents: read
  issues: write

concurrency:
  group: build-lock-incident-recovery-audit
  cancel-in-progress: false

jobs:
  audit:
    name: Publish active build lock incident recovery evidence
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: true

      - name: Audit active build lock incident
        run: go run ./cmd/lock-recovery-audit --lock=wallstop-organization-builds --state-ref=lock-state
        env:
          GITHUB_API_URL: ${{ github.api_url }}
          GITHUB_SERVER_URL: ${{ github.server_url }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          GITHUB_TOKEN: ${{ github.token }}
