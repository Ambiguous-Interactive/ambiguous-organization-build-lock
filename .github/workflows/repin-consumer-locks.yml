name: Repin consumer lock references

on:
  schedule:
    - cron: "37 6 * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: repin-consumer-locks
  cancel-in-progress: false

jobs:
  repin:
    name: Repin consumer lock pull requests
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
    steps:
      - name: Checkout trusted policy repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          ref: main

      - name: Resolve enrollment scope from reviewed registry
        id: repin-scope
        shell: bash
        run: bash tools/workflows/repin-consumer-locks.sh resolve-scope

      - name: Mint consumer-scoped repin token
        id: repin-token
        uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510 # v3.3.0
        with:
          app-id: ${{ secrets.BUILD_LOCK_APP_ID }}
          private-key: ${{ secrets.BUILD_LOCK_APP_PRIVATE_KEY }}
          owner: Ambiguous-Interactive
          repositories: ${{ steps.repin-scope.outputs.repositories }}
          permission-contents: write
          permission-pull-requests: write
          permission-workflows: write

      - name: Repin consumer lock pull requests
        env:
          CONSUMER_AUTHORIZATION: ${{ steps.repin-token.outputs.token }}
        run: bash tools/workflows/repin-consumer-locks.sh repin-consumers
