name: Reap stale build locks

on:
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch:

concurrency:
  group: build-lock-reaper
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  reap:
    name: Reap stale Unity lock
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Reap stale wallstop organization build lock
        uses: ./.github/actions/reap-stale-locks
        with:
          lock-name: wallstop-organization-builds
          operation: reap
        env:
          BUILD_LOCK_APP_ID: ${{ secrets.BUILD_LOCK_APP_ID }}
          BUILD_LOCK_APP_PRIVATE_KEY: ${{ secrets.BUILD_LOCK_APP_PRIVATE_KEY }}
          BUILD_LOCK_READER_APP_ID: ${{ secrets.BUILD_LOCK_READER_APP_ID }}
          BUILD_LOCK_READER_APP_PRIVATE_KEY: ${{ secrets.BUILD_LOCK_READER_APP_PRIVATE_KEY }}
