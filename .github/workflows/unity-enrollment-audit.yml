name: Organization Unity enrollment audit

on:
  push:
    branches:
      - main
    paths:
      - ".github/workflows/request-unity-enrollment-audit.yml"
      - ".github/workflows/request-unity-repository-onboarding.yml"
      - ".github/workflows/onboard-unity-repository.yml"
      - ".github/workflows/unity-enrollment-audit.yml"
      - ".github/actions/**"
      - ".github/dist/**"
      - "cmd/audit-unity-enrollment/**"
      - "cmd/onboard-unity-repository/**"
      - "cmd/sync-unity-enrollment-issue/**"
      - "internal/enrollment/**"
      - "locks/**"
      - "tools/workflows/**"
      - "unity-enrollment-policy.json"
  schedule:
    - cron: "23 8 * * *"
  workflow_run:
    workflows:
      - Request organization Unity enrollment audit
    types:
      - completed

permissions:
  contents: read
  issues: write

concurrency:
  group: organization-unity-enrollment-audit
  cancel-in-progress: false

jobs:
  audit:
    name: Audit enrolled Unity consumers
    if: >-
      ${{
        github.event_name != 'workflow_run' ||
        (
          github.event.workflow_run.conclusion == 'success' &&
          github.event.workflow_run.head_repository.full_name == github.repository
        )
      }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout trusted policy repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          ref: main

      - name: Setup Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: true

      - name: Resolve exact reader scope from reviewed registry
        id: enrollment-scope
        shell: bash
        run: bash tools/workflows/unity-enrollment-audit.sh resolve-scope

      - name: Mint exact repository-scoped reader token
        id: reader-token
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        with:
          app-id: ${{ secrets.BUILD_LOCK_READER_APP_ID }}
          private-key: ${{ secrets.BUILD_LOCK_READER_APP_PRIVATE_KEY }}
          owner: Ambiguous-Interactive
          repositories: ${{ steps.enrollment-scope.outputs.repositories }}
          permission-contents: read

      - name: Checkout reviewed repository default branches
        env:
          READER_AUTHORIZATION: ${{ steps.reader-token.outputs.token }}
        shell: bash
        run: bash tools/workflows/unity-enrollment-audit.sh clone-consumers

      - name: Audit exact consumer snapshots
        id: enrollment-audit
        if: ${{ always() }}
        continue-on-error: true
        run: go run ./cmd/audit-unity-enrollment --policy unity-enrollment-policy.json --repositories-root .policy-consumers --output "${RUNNER_TEMP}/unity-enrollment-audit.json"

      - name: Revalidate default-branch heads
        id: head-revalidation
        if: ${{ always() && steps.reader-token.outcome == 'success' }}
        shell: bash
        env:
          READER_AUTHORIZATION: ${{ steps.reader-token.outputs.token }}
          AUDIT_PATH: ${{ runner.temp }}/unity-enrollment-audit.json
        run: bash tools/workflows/unity-enrollment-audit.sh revalidate-heads

      - name: Upload full sanitized audit evidence
        id: audit-evidence
        if: ${{ always() }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: unity-enrollment-audit-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/unity-enrollment-audit.json
          if-no-files-found: error
          retention-days: 30
          compression-level: 9

      - name: Synchronize deduplicated drift issue
        if: ${{ always() }}
        env:
          GITHUB_TOKEN: ${{ github.token }}
          GITHUB_SERVER_URL: ${{ github.server_url }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          GITHUB_RUN_ID: ${{ github.run_id }}
          UNITY_AUDIT_ARTIFACT_URL: ${{ steps.audit-evidence.outputs.artifact-url }}
        run: go run ./cmd/sync-unity-enrollment-issue --audit "${RUNNER_TEMP}/unity-enrollment-audit.json"

      - name: Record sanitized audit counts
        if: ${{ always() }}
        env:
          AUDIT_PATH: ${{ runner.temp }}/unity-enrollment-audit.json
        shell: bash
        run: bash tools/workflows/unity-enrollment-audit.sh record-counts
