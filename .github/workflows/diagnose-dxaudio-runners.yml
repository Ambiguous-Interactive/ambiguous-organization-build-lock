name: Diagnose DxAudio runner visibility

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  diagnose:
    name: List visible runner groups and runners
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Mint reader token for DxAudio
        id: reader
        uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510 # v3.3.0
        with:
          app-id: ${{ secrets.BUILD_LOCK_READER_APP_ID }}
          private-key: ${{ secrets.BUILD_LOCK_READER_APP_PRIVATE_KEY }}
          owner: Ambiguous-Interactive
          repositories: DxAudio
          permission-organization-self-hosted-runners: read
      - name: List runner groups
        env:
          GH_TOKEN: ${{ steps.reader.outputs.token }}
        run: |
          set -euo pipefail
          gh api "/orgs/Ambiguous-Interactive/actions/runner-groups?visible_to_repository=DxAudio&per_page=100" > groups.json
          jq -r '.runner_groups[] | "\(.id) \(.name) visibility=\(.visibility) selected=\(.selected_repositories_url // "")"' groups.json
          jq -r '.runner_groups[].id' groups.json | while read -r id; do
            echo "== group $id"
            gh api "/orgs/Ambiguous-Interactive/actions/runner-groups/$id/runners?per_page=100" --jq '.runners[] | "\(.name) status=\(.status) busy=\(.busy) labels=[\([.labels[].name]|join(","))]"'
          done
