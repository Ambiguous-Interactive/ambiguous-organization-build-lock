name: Request Unity repository onboarding

on:
  workflow_dispatch:
    inputs:
      repository:
        description: Full Ambiguous-Interactive/Repository name
        required: true
        type: string
      default_branch:
        description: Current default branch
        required: true
        type: string
      fork:
        description: Repository is a fork
        required: true
        default: false
        type: boolean
      allow_workflow_dispatch:
        description: Audited workflows may use workflow_dispatch
        required: true
        default: false
        type: boolean

permissions: {}

concurrency:
  group: request-unity-repository-onboarding
  cancel-in-progress: false

jobs:
  request:
    name: Request trusted default-branch onboarding
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: Checkout request automation
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          ref: main

      - name: Reject non-default-branch request
        env:
          REQUEST_REF: ${{ github.ref }}
        shell: bash
        run: bash tools/workflows/request-unity-repository-onboarding.sh validate-ref

      - name: Record inert onboarding request
        env:
          TARGET_REPOSITORY: ${{ inputs.repository }}
          TARGET_DEFAULT_BRANCH: ${{ inputs.default_branch }}
          TARGET_FORK: ${{ inputs.fork }}
          TARGET_ALLOW_WORKFLOW_DISPATCH: ${{ inputs.allow_workflow_dispatch }}
        shell: bash
        run: bash tools/workflows/request-unity-repository-onboarding.sh write-request

      - name: Upload inert onboarding request
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: unity-onboarding-request
          path: ${{ runner.temp }}/unity-onboarding-request.json
          if-no-files-found: error
          retention-days: 1
