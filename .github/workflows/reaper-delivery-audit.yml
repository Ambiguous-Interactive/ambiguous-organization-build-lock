name: Reaper delivery audit

on:
  schedule:
    - cron: "7,17,27,37,47,57 * * * *"
  workflow_dispatch:
  workflow_run:
    workflows: ["Reap stale build locks"]
    types: [completed]

permissions:
  actions: read
  contents: read
  issues: write

concurrency:
  group: reaper-delivery-audit
  cancel-in-progress: false

jobs:
  audit:
    name: Detect overdue scheduled reaping
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: true

      - name: Audit scheduled reaper delivery
        run: go run ./cmd/reaper-delivery-audit --workflow=reap-stale-locks.yml --max-delivery-delay=30m --max-run-duration=15m
        env:
          GITHUB_API_URL: ${{ github.api_url }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          GITHUB_TOKEN: ${{ github.token }}
