name: Auto release

on:
  schedule:
    - cron: "0 9 * * 1"
  workflow_dispatch:

concurrency:
  group: auto-release
  cancel-in-progress: false

permissions:
  contents: write
  issues: write
  pull-requests: write
  actions: write

jobs:
  release:
    name: Create semantic release
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Publish release from conventional commits
        id: semantic
        uses: cycjimmy/semantic-release-action@ad51787758d9654d5a75150a89a6fa9b3ccef95e # v8.1.4
        with:
          semantic_version: 25.0.9
          extra_plugins: |
            @semantic-release/commit-analyzer@13.0.1
            @semantic-release/release-notes-generator@14.1.1
            @semantic-release/github@12.0.10
          branches: |
            ["main"]
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Report unreleasable commit subjects
        if: steps.semantic.outputs.new_release_published != 'true'
        run: bash tools/workflows/report-nonconventional-commits.sh

      - name: Update v1 major tag alias
        if: steps.semantic.outputs.new_release_published == 'true' && steps.semantic.outputs.new_release_major_version == '1'
        run: bash tools/workflows/auto-release.sh
        env:
          RELEASE_VERSION: ${{ steps.semantic.outputs.new_release_version }}

      - name: Mint release authorization token
        id: release-token
        uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510 # v3.3.0
        with:
          app-id: ${{ secrets.BUILD_LOCK_APP_ID }}
          private-key: ${{ secrets.BUILD_LOCK_APP_PRIVATE_KEY }}
          owner: Ambiguous-Interactive
          repositories: ambiguous-organization-build-lock
          permission-contents: write
          permission-pull-requests: write

      - name: Open release authorization pull request
        run: bash tools/workflows/open-release-authorization-pr.sh
        env:
          RELEASE_VERSION: ${{ steps.semantic.outputs.new_release_version }}
          RELEASE_AUTHORIZATION: ${{ steps.release-token.outputs.token }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
