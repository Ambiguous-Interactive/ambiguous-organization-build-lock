name: Build lock CI

on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    name: Validate lock action files
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "24"

      - name: Setup Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: true
          cache-dependency-path: |
            go.sum
            tools/actionlint/go.sum

      - name: Check JavaScript syntax
        run: bash tools/workflows/ci.sh syntax

      - name: Validate agent context harness
        run: node tools/llm-harness.mjs check

      - name: Lint GitHub Actions workflows
        shell: bash
        run: go -C tools/actionlint run -mod=readonly github.com/rhysd/actionlint/cmd/actionlint -color

      - name: Run fast action tests
        run: node --test test/*.test.js

      - name: Run Go tests
        run: go test ./...

      - name: Run Go vet
        run: go vet ./...

      - name: Run Go race detector
        run: go test -race ./...

      - name: Verify Go module checksums
        run: bash tools/workflows/ci.sh verify-modules

      - name: Verify Go modules are tidy
        run: bash tools/workflows/ci.sh tidy-modules

      - name: Reject credential-shaped workflow env literals
        run: go run ./cmd/workflow-credential-audit .

  windows-evidence-deletion:
    name: Validate Windows evidence deletion
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "24"

      - name: Run cleanup evidence tests
        shell: pwsh
        run: node --test test/unity-cleanup-evidence.test.js
        env:
          UNITY_DELETE_TEST_DIAGNOSTICS: "true"
