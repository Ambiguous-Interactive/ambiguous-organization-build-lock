name: Classify Unity changes
description: Conservatively require Unity validation unless every changed path is central or caller-declared Unity-independent.
inputs:
  event-name:
    description: Exact GitHub event name.
    required: true
  base-sha:
    description: Base commit SHA of the pull request or merge group.
    required: false
  head-sha:
    description: Head commit SHA of the pull request or merge group.
    required: false
  independent-paths:
    description: >-
      Newline-separated directory prefixes of the form "dir/**" that THIS caller declares inert to
      its own Unity build. Unioned with the central allowlist, never narrowing it. Assets/,
      Packages/, ProjectSettings/ and .github/workflows/ are refused. Any other syntax fails closed.
    required: false
  incremental-validation:
    description: >-
      Literal true to skip a follow-up pull request push that changes no Unity path since the
      newest successful run of this workflow on this branch, or a push whose tree a successful
      pull request run already holds. The record is read from the repository's own run history,
      so this needs github-token. Any lookup failure keeps Unity required. Absent or any other
      value keeps the whole-diff answer.
    required: false
  github-token:
    description: >-
      Token that reads this repository's run history for incremental-validation. Use
      ${{ github.token }}. The job needs actions: read; the default token grants it, and a
      workflow that narrows permissions must grant it. Omit when the mode is off.
    required: false
outputs:
  unity-required:
    description: True unless a pull request or merge group changes only central or caller-declared Unity-independent paths, a follow-up pull request push changes no Unity path, or a push holds a tree a successful pull request run already validated.
runs:
  using: node24
  main: ../../dist/classify-unity-changes.js
