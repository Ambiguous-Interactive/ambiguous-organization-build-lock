name: Reap stale build locks
description: Clear stale holders and completed queue entries from a build lock, report read-only status, or recover a confirmed quarantine or incident.
inputs:
  lock-name:
    description: Lock name to inspect.
    required: true
  lock-repository:
    description: Repository that stores lock state.
    required: false
    default: Ambiguous-Interactive/ambiguous-organization-build-lock
  state-branch:
    description: Branch that stores lock state JSON files.
    required: false
    default: lock-state
  operation:
    description: "reap, read-only status, recover a runner quarantine, or recover-incident after portal cleanup."
    required: false
    default: reap
  reservation-id:
    description: Exact opaque quarantine reservation ID required for recovery.
    required: false
  resource-safe:
    description: Explicit external resource cleanup confirmation required for recovery.
    required: false
    default: "false"
  incident-id:
    description: Optional exact active global incident ID; when omitted, bind to the single active incident in lock state.
    required: false
  portal-cleanup-confirmed:
    description: Explicit proof that Unity portal cleanup was completed.
    required: false
    default: "false"
  github-token:
    description: >-
      Optional token with Actions read access on the lock repository. Status
      uses it only to name the last successful scheduled reaper run. A caller
      token from another repository cannot read that history, so status also
      reads anonymously, within GitHub's anonymous read limit. Status reads the
      public lock state without a credential and never writes.
    required: false
outputs:
  reaped:
    description: "true when stale state was handled or a reservation recovery completed. Status writes no value."
  state-sha:
    description: Lock-state file SHA after reaping. Status writes no value.
  admission:
    description: >-
      Status only: open when no incident blocks admission and at least one slot is
      free, otherwise blocked. It describes the lock-wide condition, not the outcome
      for one caller.
  blocking-cause:
    description: "Status only: none, incident, or capacity."
  incident-id:
    description: "Status only: active global incident ID, or empty when none is active."
  blocking-reservation-ids:
    description: >-
      Status only: comma-separated quarantine reservations that consume free capacity.
      A cooldown is not named because recovery does not accept it.
  free-capacity:
    description: >-
      Status only: max-holders minus holders minus reservations. It is negative when a
      reviewed max-holders reduction left the state over capacity.
  last-reaper-at:
    description: "Status only: creation time of the last successful scheduled reaper run, or empty when unproven."
runs:
  using: node24
  main: ../../dist/reap.js
