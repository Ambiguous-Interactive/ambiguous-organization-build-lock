name: Check Unity runner registration
description: Fail closed unless every required label set has a registered runner accessible to the calling repository.
inputs:
  reader-app-id:
    description: GitHub App ID with organization self-hosted runners read permission.
    required: true
  reader-app-private-key:
    description: Private key for the runner-inventory reader GitHub App.
    required: true
  owner:
    description: Organization that owns the Unity runners.
    required: false
    default: Ambiguous-Interactive
  required-label-sets:
    description: JSON array of label arrays; every label array must match at least one registered accessible runner.
    required: true
outputs:
  registered-runner-count:
    description: Number of registered runners in groups visible to the calling repository.
  matched-runners:
    description: JSON array of per-label-set entries carrying the matching registered runner names.
runs:
  using: node24
  main: ../../dist/check-unity-runners.js
