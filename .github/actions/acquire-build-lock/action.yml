name: Acquire build lock
description: Acquire a central organization build lock before licensed work.
inputs:
  lock-name:
    description: Lock name. Use wallstop-organization-builds for Unity.
    required: true
  holder-id-suffix:
    description: Extra identity for matrix cells inside the same workflow job.
    required: false
    default: default
  runner-id:
    description: Stable physical runner identity. Required when runner serialization is activated.
    required: false
  github-token:
    description: >-
      GitHub token with Actions read access, plus pull request read access for PR
      runs. Records the exact numeric job ID for safe stale reaping and binds
      queued PR admission to the event head. It also measures runner-wait-ms, so that
      output stays empty without it.
    required: false
  pull-request-number:
    description: Pull request number to revalidate throughout the FIFO wait. Required for pull request runs.
    required: false
  expected-head-sha:
    description: Exact pull request event head SHA. Required for pull request runs.
    required: false
  lock-repository:
    description: Repository that stores lock state.
    required: false
    default: Ambiguous-Interactive/ambiguous-organization-build-lock
  state-branch:
    description: Branch that stores lock state JSON files.
    required: false
    default: lock-state
  timeout-minutes:
    description: Maximum time to wait for the lock.
    required: false
    default: "180"
  lease-minutes:
    description: Stale-holder lease duration.
    required: false
    default: "240"
  poll-seconds:
    description: Base polling delay while queued; a known earlier cooldown expiry wakes the waiter sooner.
    required: false
    default: "15"
  require-resource-lifecycle:
    description: Fail unless the loaded lock config has resource lifecycle protection enabled.
    required: false
    default: "false"
  minimum-release-cooldown-seconds:
    description: Fail unless the loaded lock config's release cooldown is at least this many seconds.
    required: false
    default: "0"
outputs:
  acquired:
    description: "true when this action acquired the lock."
  lock-name:
    description: Acquired lock name.
  holder-id:
    description: Unique holder identity for this run.
  state-sha:
    description: Lock-state file SHA after acquire.
  wait-ms:
    description: >-
      Milliseconds this action spent before its outcome. Measured from the start of the
      acquire routine, after the action reads its inputs. Covers the organization FIFO
      wait and this action's own setup reads. Excludes the time before the job reached a
      runner; runner-wait-ms reports that time.
  runner-wait-ms:
    description: >-
      Milliseconds the job waited for a GitHub runner before this action could start.
      Measured from the exact job's own Actions timeline. Empty when the wait cannot be
      proven, which needs github-token and runner-id. A proven wait shorter than the
      one-second resolution of that timeline reports 0. An unproven wait is never 0.
  queue-position:
    description: >-
      1-based organization FIFO position this caller last waited at, and 0 when it never
      waited. The job summary reports the same value.
  attempts:
    description: Poll iterations in the acquire wait loop.
  stale-recovered:
    description: Compatibility output; always false because only the scheduled reaper handles stale holders.
  quarantine-recovered:
    description: "true when this acquire atomically reclaimed a quarantine on the same physical runner."
  admission-result:
    description: "acquired, timeout, account-blocked, account-blocked-cleanup-failed, superseded, pr-head-check-failed, or pr-head-cleanup-failed."
  incident-id:
    description: Active global incident ID when admission is account-blocked.
  resource-health:
    description: Effective resource health observed during admission.
  resource-reason:
    description: Stable resource reason code when admission is blocked.
runs:
  using: node24
  main: ../../dist/acquire.js
