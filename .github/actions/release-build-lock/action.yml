name: Release build lock
description: Release a central organization build lock after licensed work.
inputs:
  lock-name:
    description: Lock name. Use wallstop-organization-builds for Unity.
    required: true
  holder-id-suffix:
    description: Extra identity for matrix cells inside the same workflow job.
    required: false
    default: default
  holder-id:
    description: Exact acquire holder-id to clean and report. If unavailable, reconstruct <repository>:<run-id>:<source-job-id>:<holder-id-suffix>. Targets must belong to the current repository and workflow run.
    required: false
  runner-id:
    description: Physical identity of the runner executing cleanup. Required when runner serialization is active.
    required: false
  resource-safe:
    description: Deprecated compatibility input. True maps to confirmed/healthy; false maps to unknown/healthy.
    required: false
  resource-cleanup-status:
    description: "External cleanup evidence: confirmed or unknown."
    required: false
  resource-health:
    description: "Account health classification: healthy or blocked."
    required: false
  resource-reason:
    description: Allowlisted stable evidence reason code.
    required: false
  lock-repository:
    description: Repository that stores lock state.
    required: false
    default: Ambiguous-Interactive/ambiguous-organization-build-lock
  state-branch:
    description: Branch that stores lock state JSON files.
    required: false
    default: lock-state
  release-retry-deadline-seconds:
    description: >-
      Wall-clock budget for the lock-state read and write. Release retries a
      transient GitHub API failure until this deadline instead of stopping after
      a fixed attempt count, because the licensed resource is already returned by
      then. Accepts 0 or 30-3600: use 0 to restore the shared attempt-bounded
      budget, and note that a smaller positive budget leaves its narrowest phase
      too little time to mint a token and make one call. Keep it below the calling
      step's timeout-minutes. An out-of-range value is reported and ignored rather
      than failing the release.
    required: false
    default: "120"
  api-max-attempts:
    description: >-
      Attempt ceiling for the shared GitHub API retry budget, 1-100. Unset means
      5 for attempt-bounded calls and no ceiling while the release deadline is
      active. Out-of-range values are reported and ignored.
    required: false
  api-retry-base-ms:
    description: >-
      Initial GitHub API retry backoff in milliseconds, 100-60000. Unset means
      1000. Out-of-range values are reported and ignored.
    required: false
  api-retry-max-ms:
    description: >-
      Maximum GitHub API retry backoff in milliseconds, 1000-300000. Unset means
      10000. It bounds the initial backoff too, whatever the two are set to
      relative to each other.
    required: false
outputs:
  released:
    description: "true when this action released a held lock."
  queue-cleaned:
    description: "true when this action removed this run from the wait queue."
  cleanup-result:
    description: >-
      cooldown-started, quarantined, global-quarantined, released, queue-cleaned,
      noop, or lock-release-unreachable when confirmed cleanup could not be
      recorded because the lock-state file stayed unreachable.
  lock-name:
    description: Target lock name.
  holder-id:
    description: Unique holder identity for this run.
  state-sha:
    description: Observed or written lock-state file SHA after cleanup.
  held-by:
    description: Holder identity when another run still holds the lock.
  held-by-run-url:
    description: Holder workflow run URL when another run still holds the lock.
  reservation-id:
    description: Opaque lifecycle reservation created when holder ownership is removed.
  reservation-state:
    description: cooldown or quarantine when a lifecycle reservation was created.
  available-at:
    description: Earliest availability time for a cooldown reservation.
  incident-id:
    description: Active immutable global incident ID, when account health is blocked.
  resource-health:
    description: Caller-local resource health after cleanup reporting.
  resource-reason:
    description: Stable caller-local resource reason code.
  report-degraded:
    description: "true when invalid cleanup-report inputs were replaced with unknown/healthy evidence before exact ownership cleanup."
  report-validation-error:
    description: Stable validation error code when report-degraded is true.
runs:
  using: node24
  main: ../../dist/release.js
